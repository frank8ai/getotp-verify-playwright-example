name: AER PR Review & Perspective

# Autonomous Code Review & Perspective Report Generator
# Triggered on any Pull Request opened or synchronized.
# Generates a CodeRabbit-grade structural review and upserts it into the PR comments.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  perspective-review:
    name: Generate and publish PR review perspective
    runs-on: ubuntu-latest
    steps:
      - name: Ensure GitHub CLI is installed
        run: |
          if ! command -v gh &> /dev/null; then
            GH_VER="2.68.0"
            curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VER}/gh_${GH_VER}_linux_amd64.tar.gz" -o "$RUNNER_TEMP/gh.tar.gz"
            tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
            mkdir -p "$HOME/.local/bin"
            cp "$RUNNER_TEMP/gh_${GH_VER}_linux_amd64/bin/gh" "$HOME/.local/bin/gh"
            chmod +x "$HOME/.local/bin/gh"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pyyaml jsonschema
          python -m pip install --disable-pip-version-check tools/aer-dist/aer_decision_engine-6.4.0-py3-none-any.whl

      - name: Run AER Review Perspective & Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Generating AER Review Perspective for PR #${{ github.event.pull_request.number }}..."
          mkdir -p "$RUNNER_TEMP/aer-review"
          REPORT_PATH="$RUNNER_TEMP/aer-review/perspective.md"

          # Run range perspective review against the target base branch
          python -m aer review perspective \
            --mode range \
            --from "origin/${{ github.event.pull_request.base.ref }}" \
            --to "HEAD" \
            --output "$REPORT_PATH" || true

          # Publish / Upsert to PR comments using the stable anchor
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/publish-pr-review.ps1 \
            -Repo "${{ github.repository }}" \
            -PrNumber ${{ github.event.pull_request.number }} \
            -PerspectiveReportPath "$REPORT_PATH"
